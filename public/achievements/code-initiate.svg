<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#00527c" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#0a1329" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#040711" stop-opacity="1"/>
    </radialGradient>

    <!-- Outer Frame Bevel Gradient -->
    <linearGradient id="outerFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a6e94"/>
      <stop offset="30%" stop-color="#1e2c3d"/>
      <stop offset="70%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#2a425e"/>
    </linearGradient>

    <!-- Inner Metallic Rim Gradient -->
    <linearGradient id="innerRimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#111c2d"/>
      <stop offset="70%" stop-color="#080e18"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Symbol Core Gradient -->
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#a5f3fc"/>
      <stop offset="75%" stop-color="#00d8f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Symbol 3D Bevel/Edge Gradient -->
    <linearGradient id="symbolBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Platform Gradient (3D Top) -->
    <linearGradient id="platformTopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>

    <!-- Holographic Beam Gradient -->
    <linearGradient id="holoBeam" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </linearGradient>

    <!-- High-Intensity Glow Filter -->
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft Ambient Filter -->
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ================= BADGE FRAME ================= -->
  <!-- Outer Chamfered Shield Plate -->
  <polygon points="105,35 395,35 465,105 465,395 395,465 105,465 35,395 35,105" 
           fill="url(#outerFrameGrad)" stroke="#5278a3" stroke-width="1.5"/>

  <!-- Mid Dark Layer with Drop Inset -->
  <polygon points="110,43 390,43 457,110 457,390 390,457 110,457 43,390 43,110" 
           fill="#070c16"/>

  <!-- Inner Metallic Chamfer -->
  <polygon points="113,48 387,48 452,113 452,387 387,452 113,452 48,387 48,113" 
           fill="none" stroke="url(#innerRimGrad)" stroke-width="4"/>

  <!-- Badge Screen Interior -->
  <polygon points="118,55 382,55 445,118 445,382 382,445 118,445 55,382 55,118" 
           fill="url(#bgGlow)"/>

  <!-- Subtle Horizon Base Shadow inside screen -->
  <ellipse cx="250" cy="385" rx="140" ry="40" fill="#00f2ff" opacity="0.08" filter="url(#coreGlow)"/>

  <!-- ================= CIRCUIT TRACES & PARTICLES ================= -->
  <!-- Left Circuit Nodes -->
  <g stroke="#00d8f6" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 65 210 L 115 210 L 140 185 L 140 145 L 160 125"/>
    <circle cx="160" cy="125" r="3" fill="#00d8f6"/>

    <path d="M 65 230 L 125 230 L 155 260 L 155 300 L 175 320"/>
    <circle cx="175" cy="320" r="3" fill="#00d8f6"/>

    <path d="M 75 250 L 110 250 L 135 275 L 135 340 L 150 355"/>
    <circle cx="150" cy="355" r="2.5" fill="#00d8f6"/>
  </g>

  <!-- Right Circuit Nodes -->
  <g stroke="#00d8f6" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 435 210 L 385 210 L 360 185 L 360 145 L 340 125"/>
    <circle cx="340" cy="125" r="3" fill="#00d8f6"/>

    <path d="M 435 230 L 375 230 L 345 260 L 345 300 L 325 320"/>
    <circle cx="325" cy="320" r="3" fill="#00d8f6"/>

    <path d="M 425 250 L 390 250 L 365 275 L 365 340 L 350 355"/>
    <circle cx="350" cy="355" r="2.5" fill="#00d8f6"/>
  </g>

  <!-- Digital Floating Pixels & Commit Sparks -->
  <g fill="#a5f3fc" opacity="0.65">
    <rect x="180" y="110" width="4" height="4" filter="url(#coreGlow)"/>
    <rect x="315" y="105" width="5" height="5"/>
    <rect x="135" y="195" width="4" height="4"/>
    <rect x="360" y="200" width="3" height="3"/>
    <rect x="165" y="270" width="5" height="5" opacity="0.4"/>
    <rect x="330" y="265" width="4" height="4"/>
    <rect x="205" y="325" width="3" height="3"/>
    <rect x="290" y="330" width="4" height="4"/>
    <rect x="145" y="160" width="3" height="3"/>
    <rect x="350" y="165" width="4" height="4"/>
    <rect x="248" y="90" width="4" height="4" fill="#ffffff" filter="url(#coreGlow)"/>
  </g>

  <!-- Upward Holographic Projection Rays -->
  <polygon points="190,360 310,360 380,120 120,120" fill="url(#holoBeam)"/>

  <!-- ================= FOUNDATION PLATFORM (SEED) ================= -->
  <!-- Platform Bottom / Extrusion -->
  <g transform="translate(0, 5)">
    <path d="M 250 388 L 315 363 L 315 378 L 250 403 L 185 378 L 185 363 Z" 
          fill="#172554"/>
    <path d="M 250 403 L 315 378 L 315 383 L 250 408 L 185 383 L 185 378 Z" 
          fill="#1e1b4b" stroke="#38bdf8" stroke-width="0.8"/>
  </g>

  <!-- Platform Base Step -->
  <path d="M 250 382 L 318 356 L 250 330 L 182 356 Z" 
        fill="#0b1329" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Inner Raised Core Plinth -->
  <path d="M 250 376 L 306 354 L 250 332 L 194 354 Z" 
        fill="url(#platformTopGrad)" stroke="#67e8f9" stroke-width="1.5"/>

  <!-- Core Radiant Light Emitter (Origin Seed) -->
  <ellipse cx="250" cy="354" rx="35" ry="13" fill="#ffffff" filter="url(#coreGlow)"/>

  <!-- Data Stream Risers from Seed -->
  <g stroke="#67e8f9" stroke-width="2" stroke-linecap="round" opacity="0.85">
    <line x1="235" y1="353" x2="235" y2="305"/>
    <line x1="250" y1="354" x2="250" y2="295"/>
    <line x1="265" y1="353" x2="265" y2="305"/>
    <circle cx="235" cy="305" r="2" fill="#ffffff"/>
    <circle cx="250" cy="295" r="2.5" fill="#ffffff"/>
    <circle cx="265" cy="305" r="2" fill="#ffffff"/>
  </g>

  <!-- ================= 3D CODE SYMBOL ( &lt; / &gt; ) ================= -->
  <!-- Ambient Back-Glow Behind Symbol -->
  <g filter="url(#coreGlow)" opacity="0.9">
    <!-- Left Bracket Glow -->
    <path d="M 205 180 L 140 236 L 205 292" fill="none" stroke="#00e5ff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Slash Glow -->
    <line x1="272" y1="160" x2="228" y2="312" stroke="#38bdf8" stroke-width="28" stroke-linecap="round"/>
    <!-- Right Bracket Glow -->
    <path d="M 295 180 L 360 236 L 295 292" fill="none" stroke="#818cf8" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- 3D Bevel/Extrusion Underlayer (Dark Depth) -->
  <g fill="none" stroke="url(#symbolBevel)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 5)">
    <!-- &lt; Depth -->
    <path d="M 205 180 L 140 236 L 205 292"/>
    <!-- / Depth -->
    <line x1="272" y1="160" x2="228" y2="312"/>
    <!-- &gt; Depth -->
    <path d="M 295 180 L 360 236 L 295 292"/>
  </g>

  <!-- Main High-Contrast Symbol Face -->
  <g fill="none" stroke="url(#cyanCore)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Angle &lt; -->
    <path d="M 205 180 L 140 236 L 205 292"/>
    <!-- Slash / -->
    <line x1="272" y1="160" x2="228" y2="312"/>
    <!-- Right Angle &gt; -->
    <path d="M 295 180 L 360 236 L 295 292"/>
  </g>

  <!-- Specular Core Centerline (Ultra-Bright Crisp Highlights) -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <!-- Left Angle Inner Specular -->
    <path d="M 202 182 L 144 236 L 202 290"/>
    <!-- Slash Specular -->
    <line x1="270" y1="164" x2="230" y2="308"/>
    <!-- Right Angle Inner Specular -->
    <path d="M 298 182 L 356 236 L 298 290"/>
  </g>
</svg>
